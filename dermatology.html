<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dermatology Diagnosis: Case Files</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--desk:#c9bfa8;--paper:#fbf7ec;--ink:#1f2a33;--mute:#5d6770;--line:#d8cdb3;--tab:#e4d3a4;--stamp:#b3261e;--note:#fff0a0;--epi:#e8b48a;--der:#f0a99a;--hyp:#f6df9a;--burn:#7d6a5a;--c1:#c0504d;--c2:#6b4226;--c3:#d9822b;--ac:var(--c1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--desk:#1a1d21;--paper:#262b31;--ink:#ece7da;--mute:#a4abb1;--line:#3a4048;--tab:#4a4331;--note:#6b5f1c;--c1:#e0746f;--c2:#b98657;--c3:#f0a050}}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--desk);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.tw{font-family:"Special Elite","Courier New",monospace}
nav{display:flex;gap:4px;padding:10px 12px 0;overflow-x:auto;position:sticky;top:0;background:var(--desk);z-index:5}
nav button{font:inherit;font-family:"Special Elite","Courier New",monospace;border:1px solid var(--line);border-bottom:0;background:var(--tab);color:var(--ink);padding:8px 14px;border-radius:10px 10px 0 0;cursor:pointer;white-space:nowrap}
nav button[aria-current=true]{background:var(--paper);border-top:4px solid var(--ac);padding-top:5px}
main{max-width:1100px;margin:0 auto 24px;background:var(--paper);border:1px solid var(--line);border-top:0;padding:26px 26px 22px;min-height:80vh;position:relative;box-shadow:0 5px 0 -1px var(--paper),0 6px 0 -1px var(--line),0 10px 0 -2px var(--paper),0 11px 0 -2px var(--line)}
h1,h2,h3{font-family:"Special Elite","Courier New",monospace;font-weight:400;margin:.2em 0}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.1rem}
.muted{color:var(--mute)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.svgbox{background:#fffdf7;border:1px solid var(--line);padding:6px}.svgbox svg{width:100%;height:auto;display:block}
.part{cursor:pointer}.part.hl{filter:drop-shadow(0 0 3px #1b6ec2)}.part.hl *{stroke:#1b6ec2}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chips button,.stg button{font:inherit;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:5px 11px;border-radius:99px;cursor:pointer}
.chips button[aria-pressed=true],.stg button[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}
.info{min-height:3.2em;padding:10px 12px;border-left:4px solid var(--ac);background:rgba(127,127,127,.1)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}
.pc{text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--tab);border:1px solid var(--line);border-top:8px solid var(--ac);padding:14px}
.pc b{display:block;font-family:"Special Elite","Courier New",monospace;font-size:1.15rem;font-weight:400}
.id{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;border:2px solid var(--ink);padding:10px 14px;margin:8px 0 16px;position:relative}
.id span,.fl span{font-family:"Special Elite","Courier New",monospace}.fl{border-bottom:1px solid var(--ink);min-width:120px;padding-right:8px}.fl small{display:block;font-size:.7rem;color:var(--mute)}.id::before{content:"";position:absolute;top:-16px;left:26px;width:14px;height:36px;border:3px solid #8a8f96;border-radius:8px}.rec{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;gap:12px;padding:6px 26px;background:var(--tab);border:1px solid var(--line);border-bottom:2px dashed var(--ink);font-size:.85rem}
.stamp{margin-left:auto;color:var(--stamp);border:2px solid var(--stamp);padding:2px 10px;transform:rotate(-4deg);font-family:"Special Elite","Courier New",monospace}
.stg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
details{border:1px solid var(--line);margin:8px 0;background:rgba(127,127,127,.05)}
summary{cursor:pointer;padding:10px 12px;font-family:"Special Elite","Courier New",monospace;border-left:6px solid var(--ac)}
details ul{margin:0;padding:4px 14px 12px 32px}details li{margin:4px 0}
.notes{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.note{background:var(--note);color:#2b2500;padding:12px 14px;width:200px;box-shadow:2px 3px 6px rgba(0,0,0,.25);font-family:"Special Elite","Courier New",monospace;font-size:.92rem}
.note{margin:8px 6px 10px auto;transform:rotate(1.5deg)}.note::before{content:"Doctor’s note";display:block;font-size:.7rem;opacity:.65}
.ph{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:8px}
figure{margin:0;position:relative;cursor:pointer;background:#fff;padding:6px 6px 8px;border:1px solid var(--line);box-shadow:1px 2px 5px rgba(0,0,0,.2)}
figure img{width:100%;display:block}
figcaption{font-size:.82rem;color:#333;padding-top:4px;font-family:"Special Elite","Courier New",monospace}
.cr{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(15,20,25,.88);color:#fff;font-size:.78rem;padding:7px 9px;display:none}
figure.on .cr{display:block}
.ref li{margin:8px 0}.ref a{color:inherit;word-break:break-all}
.disc{margin-top:26px;border:2px solid var(--ink);padding:14px;text-align:center;font-family:"Special Elite","Courier New",monospace}
button:focus-visible,summary:focus-visible,figure:focus-visible{outline:3px solid #1b6ec2;outline-offset:2px}
</style></head><body>

{id:"DX-001",n:"Emily Carter",a:24,job:"University student",t:"Plaque Psoriasis",cc:"Itchy, scaly red patches on elbows and knees for two years; worse during exam periods.",ly:"Epidermis",ac:"--c1",ph:[0,1,2],
st:[["Initial presentation","Small red patches with fine scale on the elbows.",{e:24,sc:2,i:.2},[["Fine scale",90,71,48],["Mild inflammation",270,215,125]]],["Active flare","Thick, raised plaques covered in silvery-white scale.",{e:42,sc:9,i:.9},[["Scale",100,147,28],["Thickened epidermis",250,250,60],["Inflamed dermis",120,120,162,150]]],["Under treatment","Flatter, paler patches; skin controlled, not cured.",{e:28,sc:3,i:.3},[["Thinner epidermis",100,130,66],["Calmer dermis",270,250,120]]]],
sec:[["Visual characteristics",["Raised patches covered with a silvery-white scale.","Common on the knees, elbows, trunk and scalp.","Plaque type makes up about 80–90% of psoriasis; the itch can become intense without treatment."]],["Likely underlying cause",["Psoriasis is thought to be an immune system problem that makes skin cells grow faster than usual: new cells form in days instead of weeks, so the epidermis thickens and scales.","Genetics play a role, and triggers include infections, skin injury and certain medications. It is not contagious."]],["Immediate treatment",["Not an emergency: gentle skin care, moisturizing, avoiding scratching, and identifying and avoiding triggers.","Diagnosis: the provider examines the skin, scalp and nails and may take a small skin sample (biopsy) to confirm the type and rule out other disorders.","Treatment depends on severity. Mild to moderate: topical corticosteroids and vitamin D analogs (long-term use of strong steroids can thin the skin). Moderate to severe: light therapy is a first-line option; oral or injected medications, including biologics, are used when other treatments haven’t worked."]],["Long-term prognosis",["Most people have psoriasis for life. It is a chronic disease with no cure that tends to cycle between flares and quiet periods.","Higher risk of other conditions, including psoriatic arthritis, type 2 diabetes, high blood pressure, cardiovascular disease and depression.","Treatment helps control symptoms, but even with successful treatment the disease usually returns."]]],
nt:["Flares worsen with stress.","Injury to the skin can trigger new patches (Koebner phenomenon).","Plaque type = 80–90% of cases."]},
{id:"DX-002",n:"James Thornton",a:52,job:"Landscaper",t:"Melanoma",cc:"A mole on his upper back has changed shape and color over several months.",ly:"Base of the epidermis, later the dermis",ac:"--c2",ph:[3,4,5],
st:[["Early lesion","Abnormal melanocytes confined to the epidermis (in situ).",{m:"early"},[["Abnormal melanocytes",110,175,74],["Normal melanocytes",285,300,79]]],["Invasive","Cancer cells penetrate the dermis.",{m:"inv"},[["Tumor invades dermis",110,175,100],["Normal melanocytes",285,300,79]]],["After excision","Surgical scar and regular follow-up.",{m:"scar"},[["Excision scar",110,176,90],["Healed epidermis",290,200,70]]]],
sec:[["Visual characteristics",["ABCDE rule: Asymmetry, Border irregular, Color varied (shades of brown and black, sometimes pink, red, white or blue), Diameter over 6 mm (melanomas can sometimes be smaller), Evolving (changing in size, shape or color).","The most important warning sign is a new spot, or one that is changing in size, shape or color, or a spot that looks different from all the others (the “ugly duckling” sign)."]],["Likely underlying cause",["It begins in melanocytes, the pigment-making cells in the lower epidermis.","DNA damage in melanocytes is most often caused by ultraviolet (UV) radiation from the sun or tanning beds. Melanoma can also appear in areas that get little sun, such as the soles of the feet or under a nail."]],["Immediate treatment",["No first aid applies. The key step is prompt dermatology evaluation, biopsy and staging.","If found early and not spread, surgical removal is often the best treatment, and in many cases no other treatment is needed. If it has spread, further options are added, chosen according to how far the cancer has spread."]],["Long-term prognosis",["Depends on how far the cancer has spread. American Cancer Society (SEER data, diagnosed 2015–2021): 5-year relative survival is over 99% for localized, 76% for regional and 36% for distant melanoma, and 95% for all stages combined.","Treatments have improved since these patients were diagnosed, so today’s outlook may be better.","Follow-up: regular full-body skin exams and sun protection."]]],
nt:["Melanoma is a small share of skin cancers but causes most skin cancer deaths.","Check your skin monthly.","Localized melanoma: over 99% 5-year survival (ACS)."]},
{id:"DX-003",n:"Daniel Reyes",a:38,job:"Mechanic",t:"Third-Degree (Full-Thickness) Burn",cc:"Flame burn on the right forearm after a fuel flash fire in his garage; the center of the wound feels numb.",ly:"Epidermis and entire dermis",ac:"--c3",ph:[6],
st:[["Early wound (first week)","Dry, waxy or charred full-thickness wound; nerve endings destroyed.",{b:"burn",e:18},[["Epidermis and dermis destroyed",200,200,100],["Nerve endings destroyed",100,40,128,34]]],["Hospital care","Wound care and a skin graft to close the wound.",{b:"graft",e:18,i:.3},[["Skin graft",90,120,70],["Wound bed",170,140,140],["No follicles or glands",285,285,150,34]]],["Long-term","Healed graft, scar and rehabilitation.",{b:"scar",e:14},[["Scar tissue",110,160,90],["No follicles or glands",280,250,125]]]],
sec:[["Visual characteristics",["The skin may look stiff, waxy white, leathery or gray, with black or brown patches or a charred appearance.","Third-degree burns can destroy nerves, so there may be little or no pain.","The burn involves all layers of the skin (which house the glands, hair follicles, melanocytes and blood vessels) and sometimes the fat and muscle beneath.","For comparison: first-degree burns affect only the epidermis, second-degree burns affect the epidermis and dermis (blisters may form), and third-degree burns involve all layers."]],["Likely underlying cause",["Burns are caused by fire, hot liquids or steam, hot objects, electricity, chemicals, radiation and sunlight. Here: flame from a fuel fire."]],["Immediate first aid and treatment",["1. Call 911 or local emergency services. Move the person away from the source of the burn if it is safe (turn off the power first for an electrical burn).","2. Check breathing; if the person isn’t breathing, start CPR if you know how.","3. Gently remove jewelry, belts or tight clothing from around the burn before swelling starts, but don’t pull off clothing stuck to the skin.","4. Loosely cover the burn with a clean, dry cloth or sterile gauze, and raise the burned area above heart level if possible.","5. Watch for shock (cool, pale skin, weak pulse, fast breathing): lay the person down and cover them with a clean, dry sheet or light blanket.","Avoid cold water, butter, toothpaste or oil on the burn, and don’t pop blisters.","Hospital care for deep burns may include medications, wound dressings, therapy and surgery; third-degree burns often need skin grafts to close the wound."]],["Long-term prognosis",["Some people need treatment at specialized burn centers and monthslong follow-up care.","Complications can include infection, fluid loss, dangerously low body temperature, scarring (hypertrophic scars or keloids), changes in skin color, pain, itching, numbness or tingling, and contractures, where scar tissue tightens skin, muscles or tendons.","Depression and anxiety can also follow burns, and skin cancer can sometimes arise in old burn scars, so therapy and long-term follow-up matter."]]],
nt:["Painless center = destroyed nerve endings.","Third-degree burns often need skin grafts.","No butter, toothpaste or oil on a burn."]}];
const nav=$=>document.getElementById("nav"),V=document.getElementById("v");let cur=0;
const tabs=["Home","Case 1","Case 2","Case 3","Credits"];
function go(i){cur=Math.max(0,Math.min(4,i));document.documentElement.style.setProperty("--ac",cur&&cur<4?`var(${C[cur-1].ac})`:"var(--c1)");nav().innerHTML=tabs.map((t,k)=>`<button aria-current="${k==cur}" data-k="${k}">${t}</button>`).join("");nav().querySelectorAll("button").forEach(b=>b.onclick=()=>go(+b.dataset.k));cur==0?home():cur==4?credits():kase(cur-1);document.getElementById("rec").innerHTML=`<span>Department of Dermatology · Patient Record</span><span>${cur==0?"Index of case files":cur==4?"Notes and credits":"Case "+cur+" of 3 · #"+C[cur-1].id}</span>`;window.scrollTo(0,0)}
function wire(box,info){box.querySelectorAll(".part").forEach(p=>p.onclick=()=>pick(p.id,box,info))}
function pick(k,box,info){box.querySelectorAll(".part").forEach(p=>p.classList.toggle("hl",p.id==k));document.querySelectorAll(".chips button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k==k));info.innerHTML=`<b>${PARTS[k][0]}.</b> ${PARTS[k][1]}`}
function home(){V.innerHTML=`<h1>Dermatology Diagnosis: Case Files</h1><p class="muted">Integumentary System · Skin Conditions · Anatomy class project</p><h2>The skin at a glance</h2><div class="grid"><div class="svgbox" id="sb">${skin({e:18},[["Nerve endings",45,40,100],["Melanocytes",235,230,79],["Sweat gland",322,262,125],["Hair follicle",95,90,115,34],["Blood vessels",185,185,125,34]])}</div><div><p>Tap a part of the diagram, or a button, to see what it does.</p><div class="chips">${Object.keys(PARTS).map(k=>`<button data-k="${k}" aria-pressed="false">${PARTS[k][0]}</button>`).join("")}</div><div class="info" id="inf">Select a layer or structure.</div></div></div><h2 style="margin-top:26px">Open a patient file</h2><div class="cards">${C.map((c,i)=>`<button class="pc" style="--ac:var(${c.ac})" data-i="${i+1}"><b>${c.t}</b>${c.n}, ${c.a}<br><span class="muted tw">Case File #${c.id}</span></button>`).join("")}</div>`;const sb=document.getElementById("sb"),inf=document.getElementById("inf");wire(sb,inf);V.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>pick(b.dataset.k,sb,inf));V.querySelectorAll(".pc").forEach(b=>b.onclick=()=>go(+b.dataset.i))}
function fig(i){const m=IM[i];return `<figure tabindex="0" role="button" aria-label="Show image credit"><img src="${m[0]}" alt="${m[1]}"><figcaption>${m[1]}</figcaption><div class="cr">${m[3]} · Wikimedia Commons · Public domain</div></figure>`}
function kase(n,st){const c=C[n];st=st||0;const s=c.st[st];V.style.setProperty("--ac",`var(${c.ac})`);document.documentElement.style.setProperty("--ac",`var(${c.ac})`);
V.innerHTML=`<h1>${c.t}</h1><div class="id">${[["Patient",c.n],["Age",c.a],["Occupation",c.job],["Layer affected",c.ly],["Case file","#"+c.id]].map(f=>`<div class="fl"><small>${f[0]}</small><span>${f[1]}</span></div>`).join("")}<span class="stamp">PATIENT RECORD</span></div><p><b class="tw">Chief complaint:</b> ${c.cc}</p>
<div class="grid"><div><div class="stg" role="group" aria-label="Stage">${c.st.map((x,k)=>`<button data-s="${k}" aria-pressed="${k==st}">Stage ${k+1}</button>`).join("")}</div><div class="svgbox">${skin(s[2],s[3])}</div><div class="info"><b class="tw">Stage ${st+1}: ${s[0]}.</b> ${s[1]}</div><h3 style="margin-top:16px">Clinical reference photos</h3><div class="muted" style="font-size:.85rem">Real patients, not the fictional case. Tap a photo for its credit.</div><div class="ph">${c.ph.map(fig).join("")}</div></div>
<div>${c.sec.map((x,k)=>`<details${k==0?" open":""}><summary>${x[0]}</summary><ul>${x[1].map(l=>`<li>${l}</li>`).join("")}</ul></details>${k<3&&c.nt[k]?`<div class="note">${c.nt[k]}</div>`:""}`).join("")}</div></div><div class="muted tw" style="text-align:right;margin-top:18px;border-top:1px dashed var(--line);padding-top:6px">Page ${n+1} of 3 · Case File #${c.id}</div>`;
V.querySelectorAll(".stg button").forEach(b=>b.onclick=()=>kase(n,+b.dataset.s));V.querySelectorAll("figure").forEach(f=>{f.onclick=()=>f.classList.toggle("on");f.onkeydown=e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();f.classList.toggle("on")}}})}
function credits(){V.innerHTML=`<h1>Notes and credits</h1><h2>Project team</h2><div class="id"><div class="fl"><small>Collaborator</small><span>Alexandra Blanco-Madruga</span></div><div class="fl"><small>Collaborator</small><span>Esthefany Gonzalez :)</span></div><span class="stamp">PROJECT TEAM</span></div><h2>Image credits</h2><ol class="ref">${IM.map(m=>`<li>${m[3]=="Unknown author"?`<i>${m[2]}</i> [Photograph]. (n.d.).`:`${m[3]}. (n.d.). <i>${m[2]}</i> [Photograph].`} Wikimedia Commons. Public domain. <a href="${P}${m[4]}">${P}${m[4]}</a></li>`).join("")}</ol>

<div class="disc">All patients and cases presented in this project are fictional and were created exclusively for educational purposes.</div>`}
